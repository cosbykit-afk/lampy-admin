name: Bug Report
description: Report a bug in the Lampy Administration App
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is.
      placeholder: "The Mail tab shows..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to the Mail tab
        2. Click on...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which release are you running? (e.g. v1.1.0)
      placeholder: "v1.1.0"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser / Client
      options:
        - Chrome (Windows)
        - Edge (Windows)
        - Safari (iOS)
        - Safari (macOS)
        - Firefox
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any error messages or log output.
      render: text
