{% extends "base.html" %}
{% block content %}
<h1>Log in</h1>
<p class="muted">Use a forum account (created by the forum app's <code>/register</code>).
Admin tabs need an account with the forum's <code>is_admin</code> flag.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Username<br><input type="text" name="username" size="32" required autofocus></label><br><br>
  <label>Password<br><input type="password" name="password" size="32" required></label><br><br>
  <button type="submit">Log in</button>
</form>
<p class="muted">No account yet? <a href="/signup">Sign up</a></p>
{% endblock %}
