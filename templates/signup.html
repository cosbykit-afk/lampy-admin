{% extends "base.html" %}
{% block content %}
<h1>Sign up</h1>
<p class="muted">Create a forum account. New accounts are not administrators —
admin tabs need the forum's <code>is_admin</code> flag.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/signup">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Username (3-20 chars, letters/digits/underscore)<br>
    <input type="text" name="username" size="32" value="{{ username|e }}" required autofocus></label><br><br>
  <label>Email<br>
    <input type="email" name="email" size="32" value="{{ email|e }}" required></label><br><br>
  <label>Password (min 8 characters)<br>
    <input type="password" name="password" size="32" required></label><br><br>
  <label>Confirm password<br>
    <input type="password" name="confirm" size="32" required></label><br><br>
  <button type="submit">Create account</button>
</form>
<p class="muted">Already have an account? <a href="/login">Log in</a></p>
{% endblock %}
