# [program:console] — supervisor snippet for the Lampy Administration App
#
# Install: copy this file's [program:console] section into
# /etc/supervisor/conf.d/lampy.conf on the box, fill in the four secret
# values below, then:
#   chmod 600 /etc/supervisor/conf.d/lampy.conf
#   supervisorctl reread && supervisorctl update
#
# Secrets live ONLY in the root-only conf file on the box. This snippet
# ships with placeholders; never commit real values.

[program:console]
command=/usr/bin/python3 /opt/lampy-console/console.py
directory=/opt/lampy-console
user=root
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/console.log
stderr_logfile=/var/log/supervisor/console_err.log
environment=
  FORUM_DB_HOST="127.0.0.1",
  FORUM_DB_PORT="5432",
  FORUM_DB_NAME="forum",
  FORUM_DB_USER="forum",
  FORUM_DB_PASS="<forum-db-password>",
  FORUM_SECRET_KEY="<random-hex-32-bytes>",
  CONSOLE_ALLOW_HTTP="1",
  CONSOLE_PORT="8090",
  DBADMIN_HOST="127.0.0.1",
  DBADMIN_PORT="5432",
  DBADMIN_USER="dbadmin",
  DBADMIN_PASS="<dbadmin-password>"
